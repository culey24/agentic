[project]
name = "harnessx"
version = "0.1.0"
description = "A from-scratch reimplementation of HarnessX: a composable, adaptive, and evolvable agent harness foundry."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.7",
    "httpx>=0.27",
    "rich>=15.0.0",
]

[project.scripts]
hx = "harnessx.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/harnessx"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.3",
]
